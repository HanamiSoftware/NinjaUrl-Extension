<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>NinjaURL&trade;</title>
    <link rel="stylesheet" href="../css/sidepanel.css">
    <script src="../js/NinjaURL.timestamp-manager.js" defer></script>
    <script src="../libs/qr-code-styling.js" defer></script>
    <script src="../js/sidepanel.js" defer></script>
</head>

<body class="app">

    <!-- Topbar -->
    <header class="topbar">
        <img src="../assets/logo/logo-small.png" class="topbar__logo">
        <div id="profile_container">
            <img id="profile_picture" style="display:none;" />
            <button class="topbar__login login" id="loginBtn">Login</button>
        </div>
    </header>

    <!-- Main -->
    <main class="main">

        <div class="hero">
            <div class="hero-img"> <img src="../assets/ui-icons/icon-dubbio.svg" class="hero__logo"></div>

            <h1 class="hero__title">
                Shorten this page?
            </h1>

            <p class="hero__url" id="currentUrl"></p>

            <button class="cta" id="shortenBtn">Shorten and Copy</button>
        </div>
        <h2 class="recents-title">Recent Shortened URLs</h2>
        <section class="recents" id="recentsList">
            <!-- recents dinamici qui -->
            
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer"><a href="www.ninjaurl.io">NinjaURL.io</a> All Right Reserved to NinjaURL&trade;</footer>

    <!-- QR modal -->
    <div id="qrModal" class="qr-modal hidden">
        <div class="qr-sticker">
            <div id="qrContainer"></div>
        </div>
    </div>

</body>
</html>
